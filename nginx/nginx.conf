# ============================================================
# nginx.conf - Nginx Reverse Proxy với HTTPS
# Proxy tới ứng dụng Node.js và pgAdmin
# Security headers, TLS 1.2/1.3, redirect HTTP → HTTPS
# ============================================================

# Số worker tự động theo CPU
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Ẩn phiên bản Nginx (bảo mật)
    server_tokens off;

    # MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format chuẩn ra stdout (Promtail thu ở phase sau)
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Tối ưu truyền file
    sendfile    on;
    tcp_nopush  on;

    # Timeout
    keepalive_timeout 65;

    # Giới hạn kích thước body (upload)
    client_max_body_size 10m;

    # ============================================================
    # Server HTTP (:80) - Redirect sang HTTPS
    # ============================================================
    server {
        listen 80;
        server_name restaurant.local localhost;

        # Redirect tất cả sang HTTPS (301 Permanent)
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # Server HTTPS (:443) - Reverse Proxy chính
    # ============================================================
    server {
        listen 443 ssl;
        server_name restaurant.local localhost;

        # --- TLS Configuration ---
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Chỉ cho phép TLS 1.2 và 1.3 (bảo mật)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cipher suites mạnh (ưu tiên server)
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        # Session cache tối ưu hiệu năng TLS
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security Headers ---
        # Đặt ở cấp server, LƯU Ý: nếu location có add_header riêng
        # thì phải lặp lại các header này (nginx ghi đè)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: Cho phép 'self' + inline CSS (một số component cần)
        # Không cần unsafe-inline cho script vì JS tách file riêng
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" always;

        # --- Proxy tới ứng dụng Node.js ---
        location / {
            proxy_pass http://restaurant-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Proxy tới pgAdmin ---
        # Truy cập qua https://restaurant.local/pgadmin/
        location /pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;

            # Lặp lại security headers (vì location có add_header riêng sẽ ghi đè server-level)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # --- Chặn truy cập /metrics từ bên ngoài (chỉ Prometheus scrape trực tiếp app qua monitoring-net) ---
        location = /metrics {
            return 404;
        }
    }

    # ============================================================
    # Server nội bộ cho Nginx Prometheus Exporter (stub_status)
    # Cổng 8081 chỉ dùng trong monitoring-net, KHÔNG publish ra host
    # ============================================================
    server {
        listen 8081;
        server_name _;

        location = /stub_status {
            stub_status;
            access_log off;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
    }
}
