# ============================================================
# nginx.conf - Nginx Reverse Proxy với HTTPS (Phase 3 Hardening)
# Rate limiting, security headers, TLS 1.2/1.3, redirect HTTP → HTTPS
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Ẩn phiên bản Nginx (bảo mật)
    server_tokens off;

    # MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format chuẩn ra stdout (Promtail thu qua docker_sd)
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Tối ưu truyền file
    sendfile    on;
    tcp_nopush  on;

    # Timeout
    keepalive_timeout 65;

    # Giới hạn kích thước body request (bảo mật: chống upload lớn)
    client_max_body_size 1m;

    # ============================================================
    # Rate Limiting Zones (chống brute-force / DDoS)
    # ============================================================
    # Zone API: 50 request/giây mỗi IP (burst cho phép spike ngắn)
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    # Zone pgAdmin: 5 request/giây mỗi IP (bảo vệ trang quản trị)
    limit_req_zone $binary_remote_addr zone=pgadmin:10m rate=5r/s;
    # Trả 429 Too Many Requests thay vì 503 mặc định
    limit_req_status 429;

    # ============================================================
    # Server HTTP (:80) - Redirect sang HTTPS
    # ============================================================
    server {
        listen 80;
        server_name restaurant.local localhost;

        return 301 https://$host$request_uri;
    }

    # ============================================================
    # Server HTTPS (:443) - Reverse Proxy chính
    # ============================================================
    server {
        listen 443 ssl;
        server_name restaurant.local localhost;

        # --- TLS Configuration ---
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security Headers (server-level) ---
        # LƯU Ý: location có add_header riêng phải lặp lại các header này
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" always;

        # Ẩn header X-Powered-By từ upstream (Express)
        proxy_hide_header X-Powered-By;

        # --- Proxy tới ứng dụng Node.js ---
        location / {
            # Rate limit API: 50r/s, burst 100, không delay
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://restaurant-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Proxy tới pgAdmin ---
        location /pgadmin/ {
            # Rate limit pgAdmin: 5r/s, burst 20, không delay
            limit_req zone=pgadmin burst=20 nodelay;

            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;

            # Lặp lại security headers (location có add_header riêng ghi đè server-level)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # --- Chặn /metrics từ bên ngoài ---
        location = /metrics {
            return 404;
        }
    }

    # ============================================================
    # Server nội bộ: stub_status cho Nginx Prometheus Exporter
    # Cổng 8081 chỉ dùng trong monitoring-net, KHÔNG publish ra host
    # ============================================================
    server {
        listen 8081;
        server_name _;

        location = /stub_status {
            stub_status;
            access_log off;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
    }
}
