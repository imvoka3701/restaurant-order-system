<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt món - Hệ thống Quản lý Nhà hàng</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Thanh điều hướng chung -->
  <nav>
    <span class="brand">🍜 Nhà hàng</span>
    <a href="/" class="active">Đặt món</a>
    <a href="/kitchen.html">Bếp</a>
    <a href="/cashier.html">Thu ngân</a>
    <a href="/revenue.html">Doanh thu</a>
  </nav>

  <div class="container">
    <h1>📋 Đặt món</h1>
    <div id="alert-box"></div>

    <div class="grid-2">
      <!-- Cột trái: Chọn bàn & Thực đơn -->
      <div>
        <!-- Chọn bàn -->
        <div class="card mb-2">
          <h2>🪑 Chọn bàn</h2>
          <select id="table-select" style="width:100%">
            <option value="">-- Chọn bàn --</option>
          </select>
        </div>

        <!-- Thực đơn, Lọc danh mục & Sắp xếp -->
        <div class="card mb-2">
          <div class="flex-between mb-1" style="flex-wrap:wrap;gap:0.75rem">
            <h2>🍽️ Thực đơn món ăn</h2>
            <div style="display:flex;gap:0.5rem;align-items:center">
              <label for="sort-select" style="font-size:0.85rem;color:var(--text-muted);font-weight:600;white-space:nowrap">Sắp xếp:</label>
              <select id="sort-select" style="padding:0.4rem 2rem 0.4rem 0.75rem;font-size:0.85rem;width:auto">
                <option value="default">Mặc định (A - Z)</option>
                <option value="price-asc">Giá: Thấp đến Cao ⬆️</option>
                <option value="price-desc">Giá: Cao đến Thấp ⬇️</option>
              </select>
            </div>
          </div>

          <!-- Tìm kiếm & Lọc danh mục -->
          <div style="margin-bottom:1rem">
            <input type="text" id="search-input" placeholder="🔍 Tìm kiếm món ăn theo tên..." style="margin-bottom:0.75rem">
            <div class="filter-bar" id="category-filter-bar">
              <button class="btn btn-sm btn-secondary active" data-category="">✨ Tất cả</button>
              <button class="btn btn-sm btn-secondary" data-category="APPETIZER">🥟 Khai vị</button>
              <button class="btn btn-sm btn-secondary" data-category="MAIN">🍲 Món chính</button>
              <button class="btn btn-sm btn-secondary" data-category="DESSERT">🍨 Tráng miệng</button>
              <button class="btn btn-sm btn-secondary" data-category="BEVERAGE">🍹 Đồ uống</button>
            </div>
          </div>

          <div id="menu-list" class="grid"></div>
        </div>
      </div>

      <!-- Cột phải: Giỏ hàng -->
      <div>
        <div class="card cart-card">
          <h2>🛒 Giỏ hàng</h2>
          <div id="cart-items"></div>
          <div class="cart-total" id="cart-total">Tổng: 0 ₫</div>
          <button class="btn btn-primary" style="width:100%" id="btn-submit">
            🚀 Gửi đơn hàng
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
