<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doanh thu - Hệ thống Quản lý Nhà hàng</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <span class="brand">🍜 Nhà hàng</span>
    <a href="/">Đặt món</a>
    <a href="/kitchen.html">Bếp</a>
    <a href="/cashier.html">Thu ngân</a>
    <a href="/revenue.html" class="active">Doanh thu</a>
  </nav>

  <div class="container">
    <h1>📊 Báo cáo Doanh thu</h1>
    <div id="alert-box"></div>

    <!-- Bộ lọc ngày -->
    <div class="card mb-2">
      <h2>📅 Lọc theo ngày</h2>
      <div style="display:flex;gap:1.25rem;align-items:flex-end;flex-wrap:wrap">
        <label style="font-size:0.85rem;font-weight:600;color:var(--text-muted)">Từ ngày:
          <input type="date" id="date-from" style="margin-top:0.35rem">
        </label>
        <label style="font-size:0.85rem;font-weight:600;color:var(--text-muted)">Đến ngày:
          <input type="date" id="date-to" style="margin-top:0.35rem">
        </label>
        <button class="btn btn-primary" id="btn-load-revenue">🔍 Xem báo cáo</button>
      </div>
    </div>

    <!-- Tổng quan KPI Cards -->
    <div id="summary" class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Đang tải số liệu...</div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Doanh thu theo ngày -->
      <div class="card">
        <h2>📈 Doanh thu theo ngày</h2>
        <table>
          <thead>
            <tr><th>Ngày</th><th>Số đơn</th><th>Doanh thu</th></tr>
          </thead>
          <tbody id="daily-body"></tbody>
        </table>
      </div>

      <!-- Top món bán chạy -->
      <div class="card">
        <h2>🏆 Top món bán chạy</h2>
        <table>
          <thead>
            <tr><th>Món</th><th>Danh mục</th><th>SL bán</th><th>Doanh thu</th></tr>
          </thead>
          <tbody id="top-items-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/revenue.js"></script>
</body>
</html>
