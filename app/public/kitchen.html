<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bếp - Hệ thống Quản lý Nhà hàng</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <span class="brand">🍜 Nhà hàng</span>
    <a href="/">Đặt món</a>
    <a href="/kitchen.html" class="active">Bếp</a>
    <a href="/cashier.html">Thu ngân</a>
    <a href="/revenue.html">Doanh thu</a>
  </nav>

  <div class="container">
    <h1>👨‍🍳 Màn hình Bếp</h1>
    <p style="color:#757575;margin-bottom:1rem">Tự động cập nhật mỗi 5 giây</p>
    <div id="alert-box"></div>

    <div class="grid-2">
      <div>
        <h2>🔴 Đơn chờ xử lý (PENDING)</h2>
        <div id="pending-orders"></div>
      </div>
      <div>
        <h2>🟡 Đang chuẩn bị (PREPARING)</h2>
        <div id="preparing-orders"></div>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
    }

    function showAlert(msg, type) {
      var box = document.getElementById('alert-box');
      var div = document.createElement('div');
      div.className = 'alert alert-' + type;
      div.textContent = msg;
      box.innerHTML = '';
      box.appendChild(div);
      setTimeout(function() { if (box.contains(div)) box.removeChild(div); }, 3000);
    }

    // Tải chi tiết đơn hàng (kèm items)
    async function fetchOrderDetail(orderId) {
      var res = await fetch('/api/orders/' + orderId);
      if (!res.ok) throw new Error('Lỗi tải đơn');
      return res.json();
    }

    // Chuyển trạng thái đơn
    async function updateStatus(orderId, newStatus) {
      try {
        var res = await fetch('/api/orders/' + orderId + '/status', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus }),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert('Đơn #' + orderId + ' → ' + newStatus, 'success');
        loadOrders();
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    // Render 1 đơn hàng
    function renderOrder(order, nextStatus, btnLabel, btnClass) {
      var card = document.createElement('div');
      card.className = 'card';

      var header = document.createElement('div');
      header.className = 'flex-between mb-1';
      var title = document.createElement('strong');
      title.textContent = 'Đơn #' + order.id + ' - Bàn ' + order.table_number;
      var badge = document.createElement('span');
      badge.className = 'badge badge-' + order.status.toLowerCase();
      badge.textContent = order.status;
      header.appendChild(title);
      header.appendChild(badge);
      card.appendChild(header);

      // Thời gian tạo
      var time = document.createElement('div');
      time.style.fontSize = '0.8rem';
      time.style.color = '#757575';
      time.textContent = new Date(order.created_at).toLocaleString('vi-VN');
      card.appendChild(time);

      // Danh sách món (sẽ load async)
      var itemsList = document.createElement('div');
      itemsList.style.margin = '0.5rem 0';
      itemsList.textContent = 'Đang tải...';
      card.appendChild(itemsList);

      // Load chi tiết
      fetchOrderDetail(order.id).then(function(detail) {
        itemsList.innerHTML = '';
        if (detail.items) {
          detail.items.forEach(function(item) {
            var p = document.createElement('div');
            p.style.fontSize = '0.9rem';
            p.textContent = '• ' + item.menu_item_name + ' x' + item.quantity;
            itemsList.appendChild(p);
          });
        }
      }).catch(function() {
        itemsList.textContent = 'Không tải được chi tiết';
      });

      // Nút chuyển trạng thái
      var btn = document.createElement('button');
      btn.className = 'btn ' + btnClass;
      btn.style.marginTop = '0.5rem';
      btn.textContent = btnLabel;
      btn.onclick = function() { updateStatus(order.id, nextStatus); };
      card.appendChild(btn);

      return card;
    }

    // Tải và hiển thị đơn
    async function loadOrders() {
      try {
        // Tải PENDING
        var pendingRes = await fetch('/api/orders?status=PENDING');
        var pendingOrders = await pendingRes.json();
        var pendingDiv = document.getElementById('pending-orders');
        pendingDiv.innerHTML = '';
        if (pendingOrders.length === 0) {
          var p = document.createElement('p');
          p.style.color = '#757575';
          p.textContent = 'Không có đơn chờ';
          pendingDiv.appendChild(p);
        } else {
          pendingOrders.forEach(function(o) {
            pendingDiv.appendChild(renderOrder(o, 'PREPARING', '🔥 Bắt đầu chuẩn bị', 'btn-warning'));
          });
        }

        // Tải PREPARING
        var prepRes = await fetch('/api/orders?status=PREPARING');
        var prepOrders = await prepRes.json();
        var prepDiv = document.getElementById('preparing-orders');
        prepDiv.innerHTML = '';
        if (prepOrders.length === 0) {
          var p2 = document.createElement('p');
          p2.style.color = '#757575';
          p2.textContent = 'Không có đơn đang chuẩn bị';
          prepDiv.appendChild(p2);
        } else {
          prepOrders.forEach(function(o) {
            prepDiv.appendChild(renderOrder(o, 'SERVED', '✅ Đã phục vụ', 'btn-success'));
          });
        }
      } catch (err) {
        showAlert('Lỗi tải đơn: ' + err.message, 'error');
      }
    }

    // Khởi tạo và tự refresh
    document.addEventListener('DOMContentLoaded', function() {
      loadOrders();
      setInterval(loadOrders, 5000); // Refresh mỗi 5 giây
    });
  </script>
</body>
</html>
