# ============================================================
# dashboards.yml - Cấu hình nạp Dashboard tự động cho Grafana
# ============================================================
apiVersion: 1

providers:
  - name: 'Restaurant Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
